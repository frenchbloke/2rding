<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2rding</title>
<meta name="color-scheme" content="only light">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&family=Fredoka:wght@600;700&display=swap">
<style>
:root{--orange:#FB7701;--white:#FFFFFF;--wave:#FB7701;--accent:#FB7701;--dim:#FB7701;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::selection{background:var(--white);color:var(--orange)}
.w,.k{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background-image:none;text-shadow:none;outline:0}
.w{background-color:#FFFFFF}
.k{background-color:#FB7701}
html,body{margin:0}
body{background:var(--white);color:var(--orange);font-family:'Fredoka','Varela Round','Nunito',system-ui,sans-serif;font-weight:700;overflow-x:hidden}
header{padding:16px 20px;border-bottom:3px solid var(--orange);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--white)}
h1.logo{margin:0;color:var(--orange);font-size:clamp(40px,8vw,80px);font-weight:900;letter-spacing:-.075em;line-height:1}
.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.topleft{flex:1;min-width:0}
.logo-square{width:clamp(84px,18vw,170px);aspect-ratio:1;background:var(--white);border:3px solid var(--white);border-radius:16px;overflow:hidden;flex-shrink:0}
.logo-square img{display:block;width:100%;height:100%}
#status{margin-top:17px}
.big{color:var(--white);font-family:'Fredoka','Varela Round','Nunito',system-ui,sans-serif;font-size:clamp(56px,13vw,120px);font-weight:700;letter-spacing:-.02em;line-height:1;margin-top:10px}
.tool{display:block;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,.btn{display:inline-block;padding:11px 22px;border:0;border-radius:12px;background:var(--orange);color:var(--white);font:inherit;font-weight:900;font-size:12px;cursor:pointer;position:relative;box-shadow:inset 0 0 0 4px var(--white)}
button:hover:not(:disabled),.btn:hover{box-shadow:inset 0 0 0 5px var(--white)}
button:disabled{cursor:not-allowed;box-shadow:inset 0 0 0 1px var(--white)}
button:focus-visible,.btn:focus-within{outline:3px solid var(--white);outline-offset:2px}
#sampleBtn.rec{box-shadow:inset 0 0 0 7px var(--white)!important}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
main{padding:16px;display:grid;gap:12px;max-width:1100px;margin:0 auto}
.panel{padding:24px;border:3px solid var(--orange);border-radius:16px;background:var(--orange);color:var(--white)}
h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:900}
.panel h2{color:var(--white)}
#status{color:var(--white);font-size:13px;min-height:1.4em;margin:20px 0 12px;font-weight:800}
canvas{display:block;width:100%;height:140px;background:var(--white);border-radius:12px;border:2px solid var(--white)}
#voices{margin:14px 0;min-height:22px}
.v{display:grid;grid-template-columns:54px 1fr 210px;gap:10px;align-items:center;font-size:12px;font-weight:900;color:var(--white)}
.v i{display:block;height:10px;border-radius:6px;background:var(--orange);border:2px solid var(--white);overflow:hidden}
.v b{display:block;height:100%;background:var(--white);width:0;border-radius:6px}
.v span:last-child{text-align:right}
#kb{position:relative;height:190px;display:flex;user-select:none;touch-action:none}
.w{flex:1;background:var(--white);border:2px solid var(--orange);border-radius:0 0 10px 10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;color:var(--orange);font-size:11px;font-weight:900;cursor:pointer}
.k{position:absolute;top:0;height:62%;width:4.4%;background:var(--orange);border:2px solid var(--white);border-top:none;border-radius:0 0 8px 8px;z-index:2;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;color:var(--white);font-size:10px;font-weight:900;cursor:pointer}
.w.on{box-shadow:inset 0 0 0 5px var(--orange)}
.k.on{box-shadow:inset 0 0 0 4px var(--white)}
.locked{pointer-events:none}
.sub,.help{color:var(--orange);font-size:13px;line-height:1.5;margin:0;max-width:70ch;font-weight:800}
</style>
</head>
<body>
<main>
<section class="panel">
  <div class="top">
    <div class="topleft">
      <div class="row">
        <label class="btn">Load audio<input type="file" id="file" accept="audio/*"></label>
        <button id="sampleBtn" disabled>Sample/hold</button>
        <button id="recBtn">Record</button>
      </div>
      <div id="status">Load an audio file to begin.</div>
      <div class="big">2rding</div>
    </div>

<script>
const $=id=>document.getElementById(id);
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const KEYS=['z','s','x','d','c','v','g','b','h','n','j','m','q','2','w','3','e','r','5','t','6','y','7','u','i'];

let ctx,master,mainBuf=null,sample=null,mode='empty';

function init(){
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ctx.createDynamicsCompressor();
    master=ctx.createGain();master.gain.value=.8;
    master.connect(comp);comp.connect(ctx.destination);
    odInput=ctx.createGain();odInput.gain.value=.2;
    odShape=ctx.createWaveShaper();odShape.oversample='4x';
    odOutput=ctx.createGain();odOutput.gain.value=.5;
    odInput.connect(odShape);odShape.connect(odOutput);

    revConv=ctx.createConvolver();revConv.buffer=makeIR();
    revWet=ctx.createGain();revWet.gain.value=0;
    odOutput.connect(revDry);revDry.connect(master);
    odOutput.connect(revConv);revConv.connect(revWet);revWet.connect(master);

function odSign(x){return x===0?1:Math.abs(x)/x}
function makeIR(dur=2.5,decay=3){if(!ctx)init();const sr=ctx.sampleRate,len=Math.floor(sr*dur),b=ctx.createBuffer(2,len,sr);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return b}

    case 4:{
      for(let i=0;i<n;i++){const x=i*2/n-1;
        if(x<-.08905){t[i]=(-3/4)*(1-Math.pow(1-(Math.abs(x)-.032857),12)+(1/3)*(Math.abs(x)-.032847))+.01}
        else if(x>=-.08905&&x<.320018){t[i]=-6.153*(x*x)+3.9375*x}
        else{t[i]=.630035}}break;}
    case 5:{
      const a=2+Math.round(amount*14);
      const bits=Math.round(Math.pow(2,a-1));
      for(let i=0;i<n;i++){const x=i*2/n-1;t[i]=Math.round(x*bits)/bits}break;}
  }
  return t;
}
function odSetCurve(algo,amount){if(!odShape)return;odShape.curve=odMakeTable(algo,amount)}
async function toggleRecord(){
  if(!recording){
    init();
    try{
      if(!recDest){recDest=ctx.createMediaStreamDestination();master.connect(recDest)}
      recChunks=[];
      const mr=new MediaRecorder(recDest.stream);
      recMedia=mr;
      mr.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};
      mr.onstop=()=>{
        const blob=new Blob(recChunks,{type:mr.mimeType||'audio/webm'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=url;a.download='recording.webm';document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
        setStatus('Saved recording.');
      };
      mr.start(); recording=true; $('recBtn').textContent='Stop & Save';
      setStatus('Recording what you hear… click Stop & Save to finish.');
    }catch(err){setStatus('Recording unavailable: '+err.message)}
  }else{
    recording=false; $('recBtn').textContent='Record';
    try{recMedia.stop()}catch(e){}
  }
}
$('recBtn').addEventListener('click',toggleRecord);
function setStatus(t){$('status').textContent=t}

/* ---------- loading ---------- */
let countTok=0;
async function startCountdown(){
  const tok=++countTok,sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let txt='';
  for(const n of [3,2,1]){
    if(tok!==countTok)return;
    txt+=(txt?'':'')+n+'...';setStatus(txt);await sleep(1000);
  }
  if(tok!==countTok||mode!=='main')return;
  playMain();setStatus('Playing. Press Sample/hold to grab up to 5 seconds.');
}
function setMain(buf,name){
  countTok++;
  stopMain();killAll();G=null;$('voices').innerHTML='';
  mainBuf=buf;sample=null;region=null;mode='main';mainOff=0;
  const d=buf.getChannelData(0),W=1000,step=Math.max(1,Math.floor(d.length/W));
  peaks=new Float32Array(W*2);
  for(let i=0;i<W;i++){let mn=1,mx=-1;for(let j=i*step;j<(i+1)*step&&j<d.length;j++){const v=d[j];if(v<mn)mn=v;if(v>mx)mx=v}peaks[i*2]=mn;peaks[i*2+1]=mx}
  $('sampleBtn').disabled=true;$('kb').classList.remove('locked');
  startCountdown();
}
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;init();
  try{setStatus('Decoding…');setMain(await ctx.decodeAudioData(await f.arrayBuffer()),f.name)}
  catch(err){setStatus('That file couldn’t be decoded. Try an MP3, WAV, OGG or M4A file.')}
};
/* ---------- main playback ---------- */
function pos(){return playing?(mainOff+(ctx.currentTime-mainT))%mainBuf.duration:mainOff}
function playMain(){
  if(!mainBuf||mode!=='main')return;init();
  mainSrc=ctx.createBufferSource();mainSrc.buffer=mainBuf;mainSrc.loop=true;
  mainSrc.connect(master);mainT=ctx.currentTime;mainSrc.start(0,mainOff);
  playing=true;$('sampleBtn').disabled=false;
}
function stopMain(){
  if(playing){mainOff=pos();try{mainSrc.stop()}catch(e){}}
  playing=false;
}

/* ---------- sampling ---------- */
function cancelCap(){cap=null;$('sampleBtn').classList.remove('rec');$('sampleBtn').textContent='Sample/hold'}
$('sampleBtn').addEventListener('pointerdown',e=>{
  if(mode!=='main'||!playing||cap)return;e.preventDefault();
  cap={start:pos(),t0:ctx.currentTime};$('sampleBtn').classList.add('rec');setStatus('Sampling… release to stop.');
});
const endSample=()=>{if(cap)finishSample()};
$('sampleBtn').addEventListener('pointerup',endSample);
$('sampleBtn').addEventListener('pointercancel',endSample);
$('sampleBtn').addEventListener('pointerleave',e=>{if(cap&&!e.buttons)finishSample()});
function finishSample(){
  const el=ctx.currentTime-cap.t0,start=cap.start;
  const len=Math.min(5,el,mainBuf.duration-start);cancelCap();
  if(len<.05){setStatus('Too short. Sample at least a moment of sound.');return}
  const sr=mainBuf.sampleRate,n=Math.floor(len*sr),s0=Math.floor(start*sr);
  const b=ctx.createBuffer(2,n,sr),fade=Math.min(n>>1,Math.floor(sr*.004));
  for(let c=0;c<2;c++){
    const src=mainBuf.getChannelData(Math.min(c,mainBuf.numberOfChannels-1)),d=b.getChannelData(c);
    for(let i=0;i<n;i++){let g=1;if(i<fade)g=i/fade;else if(i>n-fade)g=(n-i)/fade;d[i]=src[s0+i]*g}
  }
  stopMain();sample=b;mode='sampled';G=new Decay();$('voices').innerHTML='';region=[start/mainBuf.duration,(start+len)/mainBuf.duration];
  if(odShape){odAlgo=Math.floor(Math.random()*6);odSetCurve(odAlgo,odCurve)}
  if(revDry) revDry.gain.value=1;
  if(revWet) revWet.gain.value=0;
  if(odInput) odInput.gain.value=.2;
  $('sampleBtn').disabled=true;
  setStatus(`Sampled ${len.toFixed(2)} s.`);
}

/* ---------- one shared decay for the whole keyboard ---------- */
/* The loop decays on a single clock that starts at the first key press. Every key plays the
   loop at whatever stage that clock has reached, so any key sounds the same at the same moment
   (only the pitch differs). When the clock reaches the final, silent loop, no key makes sound. */
class Decay{
  constructor(){
    const R=this.rng=mulberry((Math.random()*4294967296)^(Date.now()&0xffffffff));
    this.N=18+Math.floor(R()*8);                 // loops from clean to silence
    const pw=this.pw=1.3+R()*.5,half=this.N>>1;
    let S=0;for(let k=1;k<=half;k++)S+=Math.pow(k/(this.N-1),pw);
    this.A=(2.1/S)*(.85+R()*.3)*2.6;
    this.fadeStart=.35+R()*.1;this.fadePow=1.6+R()*.6;
    this.L=sample.length;this.peak=1;this.bed=null;
    this.lpEnd=150+R()*200;this.lpPow=1+R()*.35;
    this.t0=null;this.done=false;this.made=0;this.cur={};
    this.cur[0]=this.make(0);
  }
  stage(t){return this.t0===null?0:Math.max(0,Math.floor((t-this.t0)/sample.duration))}
  get(k){
    while(this.made<k){this.made++;this.cur[this.made]=this.make(this.made);delete this.cur[this.made-3]}
    return this.cur[k]||this.cur[this.made];
  }
  env(u){return u<this.fadeStart?1:Math.pow(Math.max(0,1-(u-this.fadeStart)/(1-this.fadeStart)),this.fadePow)}
  corrupt(k){
    // Data loss without hiss: soft-edged dropouts attenuate patches of the loop and the losses
    // accumulate, so the sound thins out and fades instead of filling with noise or clicks.
    const R=this.rng,L=this.L,sr=sample.sampleRate,u=k/(this.N-1);
    const h=this.A*Math.pow(u,this.pw)*(.8+R()*.4)*1.6;
    const avg=sr*.06*(.5+R());
    const n=Math.max(1,Math.round(h*L/avg));
    for(const d of this.bed){
      for(let j=0;j<n;j++){
        const len=Math.max(64,Math.floor(avg*(.3+1.4*R()))),s0=R()*L|0,depth=.55+.45*R();
        for(let i=0;i<len;i++){
          const w=Math.sin(Math.PI*i/len),g=1-depth*w*w;
          d[(s0+i)%L]*=g;
        }
      }
    }
  }
  cutoff(k){
    // explicit schedule: from the top of the spectrum down to a few hundred Hz, on a log scale
    const u=k/(this.N-1);
    return Math.exp(lerp(Math.log(20000),Math.log(this.lpEnd),Math.pow(u,this.lpPow)));
  }
  filtered(fc){
    // 4-pole (24 dB/oct) lowpass of the loop, applied after every cycle. It runs one extra
    // lap first so the loop seam stays seamless.
    const sr=sample.sampleRate,L=this.L,a=1-Math.exp(-2*Math.PI*Math.min(fc,sr*.49)/sr);
    return this.bed.map(d=>{
      const o=new Float32Array(L),y=[0,0,0,0];
      for(let n=0;n<2*L;n++){
        let x=d[n%L];
        for(let p=0;p<4;p++){y[p]+=a*(x-y[p]);x=y[p]}
        if(n>=L)o[n-L]=x;
      }
      return o;
    });
  }
  make(k){
    const S=sample,L=this.L;
    if(k===0){
      this.bed=[S.getChannelData(0).slice(),S.getChannelData(1).slice()];
      let pk=0;for(const d of this.bed)for(let i=0;i<L;i++)pk=Math.max(pk,Math.abs(d[i]));
      this.peak=pk||1;for(const d of this.bed)for(let i=0;i<L;i++)d[i]/=this.peak;
      return {buf:S,scale:1};
    }
    this.corrupt(k);
    const fc=this.cutoff(k),o=this.filtered(fc),b=ctx.createBuffer(2,L,S.sampleRate);
    b.copyToChannel(o[0],0);b.copyToChannel(o[1],1);
    return {buf:b,scale:this.peak*this.env(k/(this.N-1)),fc};
  }
}
class Voice{
  constructor(idx){
    this.idx=idx;this.rate=Math.pow(2,(idx-ROOT)/12);this.srcs=[];this.dead=false;
    this.gain=ctx.createGain();this.gain.gain.value=0;this.gain.connect(odInput?odInput:master);
    this.gain.gain.setTargetAtTime(1,ctx.currentTime,.008);
    this.run();
  }
  async run(){
    const Lv=sample.duration/this.rate;let t=ctx.currentTime+.01;
    if(G.t0===null)G.t0=t;                          // the first key press starts the decay clock
    while(!this.dead){
      while(!this.dead&&t-ctx.currentTime>.25)await new Promise(r=>setTimeout(r,40));
      if(this.dead)return;
      if(t<ctx.currentTime)t=ctx.currentTime+.01;
              const k=G.stage(t);
       if(k>=G.N-1){finishDecay();return}
       const p=G.get(k);
const u=k/(G.N-1);
       if(odInput) odInput.gain.setTargetAtTime(.3+u*1.2,ctx.currentTime,.05);
       if(revDry) revDry.gain.setTargetAtTime(Math.max(0,1-u*1.6),ctx.currentTime,.1);
       if(revWet) revWet.gain.setTargetAtTime(Math.min(.95,u*1.1),ctx.currentTime,.2);
       const s=ctx.createBufferSource();s.buffer=p.buf;s.playbackRate.value=this.rate;
      const g=ctx.createGain();g.gain.value=p.scale;s.connect(g);g.connect(this.gain);
      s.start(t);this.srcs.push(s);
      t+=Lv;
    }
  }
  kill(){
    if(this.dead)return;this.dead=true;
    this.gain.gain.setTargetAtTime(0,ctx.currentTime,.03);
    setTimeout(()=>{this.srcs.forEach(s=>{try{s.stop()}catch(e){}});this.gain.disconnect()},250);
    voices=voices.filter(v=>v!==this);
  }
}
function noteName(i){return NAMES[i%12]+(3+Math.floor(i/12))}
function trigger(idx){
  if(mode==='main')return;
  if(mode!=='sampled'||!G||G.done)return;init();
  if(voices.some(v=>v.idx===idx))return;
  while(voices.length>=MAXV)voices[0].kill();
  voices.push(new Voice(idx));
}
function release(idx){voices.filter(v=>v.idx===idx).forEach(v=>v.kill())}
function killAll(){[...voices].forEach(v=>v.kill())}
function finishDecay(){
  if(!G||G.done)return;G.done=true;killAll();held.clear();
  $('kb').classList.add('locked');
  setStatus('');
}
function statusRow(){
  if(!G)return;const r=$('stgrow');if(!r)return;
  const k=G.done?G.N-1:Math.min(G.stage(ctx.currentTime),G.N-1);
  r.firstChild.nextSibling.firstChild.style.width=(100*k/(G.N-1))+'%';
  const c=G.cur[k],f=c&&c.fc?(c.fc>=1000?(c.fc/1000).toFixed(1)+' kHz':Math.round(c.fc)+' Hz'):'full range';
  r.lastChild.textContent='';
  if(G.t0!==null&&!G.done&&k>=G.N-1)finishDecay();
}

/* ---------- keyboard ---------- */
const kb=$('kb'),keyEls=[],held=new Set(),ptr=new Map();
const up=e=>{const i=ptr.get(e.pointerId);if(i!==undefined){ptr.delete(e.pointerId);held.delete(i);release(i)}};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('blur',()=>{[...held].forEach(release);held.clear()});
(function build(){
  let wi=0;const blackSet=[1,3,6,8,10];
  const totalW=15;
  for(let i=0;i<25;i++){
    const el=document.createElement('div');el.dataset.i=i;
    el.innerHTML=`<span>${KEYS[i].toUpperCase()}</span>`;
    if(blackSet.includes(i%12)){el.className='k';el.style.left=`calc(${wi*100/totalW}% - 2.2%)`}
    else{el.className='w';wi++}
    el.title=noteName(i);
    el.addEventListener('pointerdown',e=>{e.preventDefault();ptr.set(e.pointerId,i);held.add(i);trigger(i)});
    kb.appendChild(el);keyEls.push(el);
  }
})();
addEventListener('keydown',e=>{
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
  const i=KEYS.indexOf(e.key.toLowerCase());
  if(i>=0){e.preventDefault();held.add(i);trigger(i)}
});
addEventListener('keyup',e=>{const i=KEYS.indexOf(e.key.toLowerCase());if(i>=0){held.delete(i);release(i)}});

/* ---------- drawing ---------- */
const cv=$('cv'),g2=cv.getContext('2d');
cv.addEventListener('pointerdown',e=>{
  if(!mainBuf){setStatus('No audio loaded.');return}
  if(mode!=='main'){setStatus('Click to return to main playback.');mode='main';sample=null;G=null;killAll();$('voices').innerHTML=''}
  const r=cv.getBoundingClientRect();
  const p=clamp((e.clientX-r.left)/r.width,0,1);
  stopMain();mainOff=p*mainBuf.duration;startCountdown();
});
function frame(){
  const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  g2.setTransform(dpr,0,0,dpr,0,0);g2.clearRect(0,0,w,h);
  const cs=getComputedStyle(document.documentElement),wave=cs.getPropertyValue('--wave'),acc=cs.getPropertyValue('--accent');
  if(peaks){
    if(region){g2.strokeStyle=acc;g2.lineWidth=4;g2.strokeRect(region[0]*w+2,2,(region[1]-region[0])*w-4,h-4)}
    g2.fillStyle=wave;
    const n=peaks.length/2,win=3;
    for(let i=0;i<n;i++){let mn=0,mx=0,c=0;for(let j=Math.max(0,i-win);j<=Math.min(n-1,i+win);j++){mn+=peaks[j*2];mx+=peaks[j*2+1];c++}mn/=c;mx/=c;const x=i/n*w,y1=h/2-mx*h*.45,y2=h/2-mn*h*.45;g2.fillRect(x,y1,Math.max(1,w/n),Math.max(1,y2-y1))}
    g2.globalAlpha=1;
    if(mode==='main'&&mainBuf){
      const p=pos()/mainBuf.duration;g2.fillStyle=acc;g2.fillRect(p*w-1,0,2,h);
      if(cap){
        const el=ctx.currentTime-cap.t0;
        g2.strokeStyle=acc;g2.lineWidth=4;g2.setLineDash([8,6]);g2.strokeRect(cap.start/mainBuf.duration*w+2,2,Math.max(4,(Math.min(el,5)/mainBuf.duration)*w-4),h-4);g2.setLineDash([]);
        $('sampleBtn').textContent=`Release (${Math.max(0,5-el).toFixed(1)} s)`;
        if(el>=5||el>=mainBuf.duration-cap.start)finishSample();
      }
    }
  }else{g2.fillStyle=cs.getPropertyValue('--dim');g2.font='15px Fredoka,system-ui';g2.fillText('Waveform appears here',16,h/2)}
  const live=held;
  keyEls.forEach((el,i)=>el.classList.toggle('on',live.has(i)));
  statusRow();
  requestAnimationFrame(frame);
}
frame();
</script>
